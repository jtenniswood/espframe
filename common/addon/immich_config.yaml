# =============================================================================
# IMMICH CONFIGURATION - Runtime-configurable Immich server settings
# =============================================================================
# Exposes Immich URL and API key as text entities in the web server UI.
# Values persist across reboots via NVS flash. Configure via http://<device-ip>/
# =============================================================================

# -----------------------------------------------------------------------------
# Boot flag and URL normalization on boot
# -----------------------------------------------------------------------------
substitutions:
  immich_base_url: ""
  immich_api_key: ""

globals:
  - id: immich_fetch_started
    type: bool
    initial_value: 'false'
  - id: immich_source_setup_visible
    type: bool
    initial_value: 'false'

esphome:
  on_boot:
    - priority: -300
      then:
        - lambda: |-
            std::string url = normalize_immich_base_url(id(immich_url).state);
            if (!url.empty() && is_valid_http_url(url) && url != id(immich_url).state) {
              id(immich_url).publish_state(url);
            } else if (!url.empty() && !is_valid_http_url(url)) {
              ESP_LOGW("immich", "Stored Immich URL is invalid; expected valid http(s)://host[:port]");
            }
        # Some boots connect to WiFi before restored text settings are ready.
        # Re-check once the startup screen grace period has passed so a saved
        # Immich configuration always starts the first photo fetch.
        - delay: 12s
        - if:
            condition:
              wifi.connected:
            then:
              - script.execute: immich_discover_capabilities

text_sensor:
  - platform: template
    name: "Immich: Server Version"
    id: immich_server_version
    internal: true
    update_interval: never

  - platform: template
    name: "Immich: Filter Capabilities"
    id: immich_capability_status
    internal: true
    update_interval: never

# -----------------------------------------------------------------------------
# Server URL and API key (persisted via NVS)
# -----------------------------------------------------------------------------
text:
  - platform: template
    name: "Connection: Server URL"
    id: immich_url
    internal: true
    entity_category: config
    optimistic: false
    restore_value: true
    initial_value: "${immich_base_url}"
    min_length: 0
    max_length: 255
    mode: text
    icon: "mdi:web"
    web_server:
      sorting_group_id: sg_connection
    set_action:
      - lambda: |-
          if (x.empty()) return;
          std::string url = normalize_immich_base_url(x);
          if (!is_valid_http_url(url)) {
            ESP_LOGW("immich", "Immich URL must be a valid http(s)://host[:port] URL");
            return;
          }
          id(immich_url).publish_state(url);
          global_preferences->sync();
          ESP_LOGI("immich", "Immich URL configured: %s", url.c_str());
      # Delay reconnect logic so settings are committed before any network crash path.
      - delay: 15s
      - script.execute: immich_connection_config_changed

  - platform: template
    name: "Connection: API Key"
    id: immich_api_key_text
    internal: true
    entity_category: config
    optimistic: false
    restore_value: true
    initial_value: "${immich_api_key}"
    min_length: 0
    max_length: 255
    mode: password
    icon: "mdi:key"
    web_server:
      sorting_group_id: sg_connection
    set_action:
      - lambda: |-
          if (x.empty()) return;
          id(immich_api_key_text).publish_state(x);
          global_preferences->sync();
          ESP_LOGI("immich", "Immich API key configured (%d chars)", x.length());
      # Delay reconnect logic so settings are committed before any network crash path.
      - delay: 15s
      - script.execute: immich_connection_config_changed

# -----------------------------------------------------------------------------
# Display mode: Fill (crop-to-cover) vs Fit (letterbox, no cropping)
# -----------------------------------------------------------------------------
select:
  - platform: template
    name: "Photos: Display Mode"
    id: photo_display_mode
    internal: true
    # ESPFRAME:SETTING_FIELDS display_mode START
    options:
      - "Fill"
      - "Fit"
    initial_option: "Fill"
    optimistic: true
    restore_value: true
    # ESPFRAME:SETTING_FIELDS display_mode END
    icon: "mdi:image-size-select-large"
    web_server:
      sorting_group_id: sg_photos

# -----------------------------------------------------------------------------
# When URL + key are set, show slideshow and start fetch if needed
# -----------------------------------------------------------------------------
script:
  - id: immich_connection_config_changed
    mode: restart
    then:
      - lambda: |-
          id(immich_fetch_started) = false;
          id(immich_request_state).reset();
          id(immich_candidate_pool).clear();
          id(espframe_core).slideshow().reset_state();
          id(last_photo_displayed_ms) = 0;
          id(immich_source_setup_visible) = false;
          lv_obj_add_flag(id(photo_source_show_all_button), LV_OBJ_FLAG_HIDDEN);
          id(connection_failed_dim).stop();
          id(connection_failed_shift).stop();
          lv_obj_align(id(connection_failed_content), LV_ALIGN_CENTER, 0, 0);
          lv_obj_add_flag(id(connection_failed_overlay), LV_OBJ_FLAG_HIDDEN);
          ESP_LOGI("immich", "Connection settings changed; retrying Immich connection");
      - script.execute: immich_discover_capabilities

  - id: immich_discover_capabilities
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !is_valid_http_url(id(immich_url).state);'
          then:
            - script.execute: immich_check_config_ready
            - script.stop: immich_discover_capabilities
      - http_request.get:
          id: http_req
          url: !lambda 'return id(immich_url).state + "/api/server/version";'
          capture_response: true
          max_response_buffer_size: 2kB
          request_headers:
            Accept: application/json
          on_response:
            then:
              - lambda: |-
                  std::string version;
                  ImmichApiGeneration generation = ImmichApiGeneration::V31_FLAT;
                  const bool valid = response->status_code == 200 &&
                    parse_immich_server_version(body, &version, &generation);
                  id(immich_request_state).server_version_discovered = true;
                  id(immich_request_state).server_version = valid ? version : "Unknown";
                  id(immich_request_state).api_generation = valid
                    ? generation : ImmichApiGeneration::V31_FLAT;
                  id(immich_server_version).publish_state(id(immich_request_state).server_version);
                  id(immich_capability_status).publish_state(
                    id(immich_request_state).api_generation == ImmichApiGeneration::V32_STRUCTURED
                      ? "Structured filters (Immich 3.2+)"
                      : (valid ? "Immich 3.1 compatibility" : "Version unknown; Immich 3.1 compatibility"));
                  ESP_LOGI("immich", "Server version %s; %s filters",
                           id(immich_request_state).server_version.c_str(),
                           id(immich_request_state).api_generation == ImmichApiGeneration::V32_STRUCTURED
                             ? "structured" : "flat");
              - script.execute: immich_check_config_ready
          on_error:
            then:
              - lambda: |-
                  id(immich_request_state).server_version_discovered = true;
                  id(immich_request_state).server_version = "Unknown";
                  id(immich_request_state).api_generation = ImmichApiGeneration::V31_FLAT;
                  id(immich_server_version).publish_state("Unknown");
                  id(immich_capability_status).publish_state("Version unknown; Immich 3.1 compatibility");
              - script.execute: immich_check_config_ready

  - id: show_photo_source_empty_state
    mode: single
    then:
      - lambda: |-
          const std::string source = id(photo_source_select).current_option();
          const std::string title = immich_source_setup_title(source);
          const std::string message = immich_source_setup_message(source);
          const bool was_hidden =
            lv_obj_has_flag(id(connection_failed_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_label_set_text(id(connection_failed_title), title.c_str());
          lv_label_set_text(id(connection_failed_subtitle), message.c_str());
          id(immich_source_setup_visible) = true;
          lv_obj_clear_flag(id(photo_source_show_all_button), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(connection_failed_overlay), LV_OBJ_FLAG_HIDDEN);
          if (was_hidden) {
            lv_obj_align(id(connection_failed_content), LV_ALIGN_CENTER, 0, 0);
            id(backlight_apply_brightness).execute();
            id(connection_failed_dim).execute();
            id(connection_failed_shift).execute();
          }

  - id: hide_photo_source_empty_state
    mode: single
    then:
      - lambda: |-
          if (!id(immich_source_setup_visible)) return;
          id(immich_source_setup_visible) = false;
          lv_obj_add_flag(id(photo_source_show_all_button), LV_OBJ_FLAG_HIDDEN);
          id(connection_failed_dim).stop();
          id(connection_failed_shift).stop();
          lv_obj_align(id(connection_failed_content), LV_ALIGN_CENTER, 0, 0);
          lv_obj_add_flag(id(connection_failed_overlay), LV_OBJ_FLAG_HIDDEN);
          id(backlight_apply_brightness).execute();

  - id: immich_check_config_ready
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return is_valid_http_url(id(immich_url).state) && !id(immich_api_key_text).state.empty();'
          then:
            - if:
                condition:
                  lambda: |-
                    ImmichFilterConfig config;
                    config.albums_enabled = id(immich_albums_enabled).state;
                    config.album_ids = id(immich_album_ids).state;
                    config.album_matching = id(immich_album_matching).current_option();
                    config.minimum_rating = id(immich_minimum_rating).current_option() == "Any"
                      ? 0 : static_cast<uint8_t>(atoi(id(immich_minimum_rating).current_option().c_str()));
                    config.excluded_album_ids = id(immich_excluded_album_ids).state;
                    config.excluded_person_ids = id(immich_excluded_person_ids).state;
                    config.excluded_tag_ids = id(immich_excluded_tag_ids).state;
                    return id(immich_request_state).api_generation == ImmichApiGeneration::V31_FLAT &&
                           immich_filter_requires_v32(config);
                then:
                  - lambda: |-
                      lv_label_set_text(id(connection_failed_title), "Filter needs Immich 3.2+");
                      lv_label_set_text(id(connection_failed_subtitle),
                        "This saved filter uses rules\nthat flat search cannot apply.");
                      lv_obj_clear_flag(id(connection_failed_overlay), LV_OBJ_FLAG_HIDDEN);
                      clear_slot_fetch_in_flight(id(espframe_core).slideshow().state().target_slot,
                                                 id(espframe_core).slideshow().state().slot_flags);
                  - script.stop: immich_check_config_ready
            - script.stop: setup_screen_dim
            - lvgl.page.show: slideshow_page
            - if:
                condition:
                  lambda: |-
                    return !immich_source_has_required_ids(
                      id(photo_source_select).current_option(),
                      id(immich_album_ids).state,
                      id(immich_person_ids).state,
                      id(immich_tag_ids).state);
                then:
                  - logger.log:
                      level: DEBUG
                      tag: immich
                      format: "Photo source is waiting for restored source IDs"
                  - script.execute: show_photo_source_empty_state
                  - script.execute: immich_retry_config_ready
                  - script.stop: immich_check_config_ready
            - script.execute: hide_photo_source_empty_state
            - if:
                condition:
                  lambda: |-
                    if (!id(immich_fetch_started)) return true;
                    if (id(espframe_core).slideshow().state().active_slot_displayed) return false;
                    return !any_slot_fetch_in_flight(id(espframe_core).slideshow().state().slot_flags);
                then:
                  - lambda: 'id(espframe_core).slideshow().state().target_slot = id(espframe_core).slideshow().state().active_slot;'
                  - script.execute: immich_fetch_into_slot

  - id: immich_retry_config_ready
    mode: restart
    then:
      - delay: 2s
      - script.execute: immich_check_config_ready

button:
  - platform: restart
    id: reboot_screen_button
    name: "Device: Reboot Screen"
    icon: "mdi:restart"
    web_server:
      sorting_group_id: sg_device
