# =============================================================================

globals:
  - id: immich_filter_preset_adapter_active
    type: bool
    initial_value: 'false'
  - id: immich_filter_schema_version
    type: uint8_t
    restore_value: true
    initial_value: '0'

esphome:
  on_boot:
    - priority: -250
      then:
        - delay: 2s
        - if:
            condition:
              lambda: 'return id(immich_filter_schema_version) == 0;'
            then:
              - script.execute: apply_legacy_photo_source_preset
              - lambda: |-
                  id(immich_filter_schema_version) = 1;
                  global_preferences->sync();

# IMMICH FILTER - Photo source selection and filtering
# =============================================================================
# Controls which photos the frame displays: all photos, favorites only,
# specific albums, or specific people. Values persist across reboots via NVS.
# =============================================================================

# -----------------------------------------------------------------------------
# Deprecated photo-source preset adapter. The web UI uses the composable filter;
# this entity remains for one compatibility release for Home Assistant clients.
# -----------------------------------------------------------------------------
select:
  - platform: template
    name: "Photos: Source"
    id: photo_source_select
    # ESPFRAME:SETTING_FIELDS photo_source START
    options:
      - "All Photos"
      - "Favorites"
      - "Album"
      - "Person"
      - "Tag"
      - "Memories"
      - "Custom"
    initial_option: "All Photos"
    optimistic: true
    restore_value: true
    # ESPFRAME:SETTING_FIELDS photo_source END
    icon: "mdi:image-filter-frames"
    web_server:
      sorting_group_id: sg_photos
    on_value:
      then:
        - lambda: 'ESP_LOGI("immich", "Photo source: %s", x.c_str());'
        - script.execute: apply_legacy_photo_source_preset
        - script.execute: auto_apply_photo_source

  - platform: template
    name: "Photos: Inclusion Groups"
    id: immich_inclusion_matching
    internal: true
    # ESPFRAME:SETTING_FIELDS inclusion_matching START
    options:
      - "Match all enabled groups"
      - "Match any enabled group"
    initial_option: "Match all enabled groups"
    optimistic: true
    restore_value: true
    # ESPFRAME:SETTING_FIELDS inclusion_matching END
    on_value:
      then:
        - script.execute: mark_photo_filter_custom
        - script.execute: auto_apply_photo_source

  - platform: template
    name: "Photos: Album Matching"
    id: immich_album_matching
    internal: true
    # ESPFRAME:SETTING_FIELDS album_matching START
    options:
      - "Any selected album"
      - "All selected albums"
    initial_option: "Any selected album"
    optimistic: true
    restore_value: true
    # ESPFRAME:SETTING_FIELDS album_matching END
    on_value:
      then:
        - script.execute: mark_photo_filter_custom
        - script.execute: auto_apply_photo_source

  - platform: template
    name: "Photos: Person Matching"
    id: immich_person_matching
    internal: true
    # ESPFRAME:SETTING_FIELDS person_matching START
    options:
      - "Any selected person"
      - "All selected people"
    initial_option: "Any selected person"
    optimistic: true
    restore_value: true
    # ESPFRAME:SETTING_FIELDS person_matching END
    on_value:
      then:
        - script.execute: mark_photo_filter_custom
        - script.execute: auto_apply_photo_source

  - platform: template
    name: "Photos: Favorites"
    id: immich_favorite_mode
    internal: true
    # ESPFRAME:SETTING_FIELDS favorite_mode START
    options:
      - "Any"
      - "Favorites only"
      - "Exclude favorites"
    initial_option: "Any"
    optimistic: true
    restore_value: true
    # ESPFRAME:SETTING_FIELDS favorite_mode END
    on_value:
      then:
        - script.execute: mark_photo_filter_custom
        - script.execute: auto_apply_photo_source

  - platform: template
    name: "Photos: Minimum Rating"
    id: immich_minimum_rating
    internal: true
    # ESPFRAME:SETTING_FIELDS minimum_rating START
    options:
      - "Any"
      - "1+"
      - "2+"
      - "3+"
      - "4+"
      - "5+"
    initial_option: "Any"
    optimistic: true
    restore_value: true
    # ESPFRAME:SETTING_FIELDS minimum_rating END
    on_value:
      then:
        - script.execute: mark_photo_filter_custom
        - script.execute: auto_apply_photo_source

  - platform: template
    name: "Photos: Date Filter Mode"
    id: immich_date_filter_mode
    internal: true
    # ESPFRAME:SETTING_FIELDS date_filter_mode START
    options:
      - "Fixed Range"
      - "Relative Range"
    initial_option: "Fixed Range"
    optimistic: true
    restore_value: true
    # ESPFRAME:SETTING_FIELDS date_filter_mode END
    icon: "mdi:calendar-filter"
    on_value:
      then:
        - lambda: 'ESP_LOGI("immich", "Date filter mode: %s", x.c_str());'
        - script.execute: auto_apply_photo_source

  - platform: template
    name: "Photos: Orientation"
    id: photo_orientation_filter
    internal: true
    # ESPFRAME:SETTING_FIELDS photo_orientation START
    options:
      - "Any"
      - "Portrait Only"
      - "Landscape Only"
    initial_option: "Any"
    optimistic: true
    restore_value: true
    # ESPFRAME:SETTING_FIELDS photo_orientation END
    icon: "mdi:phone-rotate-portrait"
    web_server:
      sorting_group_id: sg_photos
    on_value:
      then:
        - lambda: 'ESP_LOGI("immich", "Photo orientation: %s", x.c_str());'
        - script.execute: auto_apply_photo_source

  - platform: template
