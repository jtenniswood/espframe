    icon: "mdi:sort"
    web_server:
      sorting_group_id: sg_photos
    on_value:
      then:
        - lambda: 'ESP_LOGI("immich", "Album order: %s", x.c_str());'
        - script.execute: auto_apply_photo_source

  - platform: template
    name: "Photos: Tag Matching"
    id: immich_tag_matching
    internal: true
    # ESPFRAME:SETTING_FIELDS tag_matching START
    options:
      - "Any selected tag"
      - "All selected tags"
    initial_option: "Any selected tag"
    optimistic: true
    restore_value: true
    # ESPFRAME:SETTING_FIELDS tag_matching END
    icon: "mdi:tag-multiple"
    web_server:
      sorting_group_id: sg_photos
    on_value:
      then:
        - lambda: 'ESP_LOGI("immich", "Tag matching: %s", x.c_str());'
        - script.execute: auto_apply_photo_source

  - platform: template
    name: "Photos: Relative Unit"
    id: immich_relative_unit
    internal: true
    # ESPFRAME:SETTING_FIELDS relative_unit START
    options:
      - "Months"
      - "Years"
    initial_option: "Years"
    optimistic: true
    restore_value: true
    # ESPFRAME:SETTING_FIELDS relative_unit END
    icon: "mdi:calendar-range"
    on_value:
