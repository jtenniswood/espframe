# -----------------------------------------------------------------------------
# Manual apply and auto-apply (flush slots and refetch)
# -----------------------------------------------------------------------------
button:
  - platform: template
    name: "Apply Photo Source"
    id: apply_photo_source
    internal: true
    icon: "mdi:check-circle"
    web_server:
      sorting_group_id: sg_photos
    on_press:
      - script.stop: auto_apply_photo_source
      - lambda: 'ESP_LOGI("immich", "Photo source applied — flushing all slots");'
      - script.execute: flush_slots_and_refetch

# -----------------------------------------------------------------------------
# Delayed auto-apply after source/album/person/tag change
# -----------------------------------------------------------------------------
script:
  - id: sync_immich_filter_config
    mode: restart
    then:
      - lambda: |-
          ImmichFilterConfig config;
          config.albums_enabled = id(immich_albums_enabled).state;
          config.people_enabled = id(immich_people_enabled).state;
          config.tags_enabled = id(immich_tags_enabled).state;
          config.album_ids = id(immich_album_ids).state;
          config.person_ids = id(immich_person_ids).state;
          config.tag_ids = id(immich_tag_ids).state;
          config.album_matching = id(immich_album_matching).current_option();
          config.person_matching = id(immich_person_matching).current_option();
          config.tag_matching = id(immich_tag_matching).current_option();
          config.inclusion_matching = id(immich_inclusion_matching).current_option();
          config.favorite_mode = id(immich_favorite_mode).current_option();
          config.minimum_rating = id(immich_minimum_rating).current_option() == "Any"
            ? 0 : static_cast<uint8_t>(atoi(id(immich_minimum_rating).current_option().c_str()));
          config.country = id(immich_filter_country).state;
          config.state = id(immich_filter_state).state;
          config.city = id(immich_filter_city).state;
          config.excluded_album_ids = id(immich_excluded_album_ids).state;
          config.excluded_person_ids = id(immich_excluded_person_ids).state;
          config.excluded_tag_ids = id(immich_excluded_tag_ids).state;
          auto now = id(sntp_time).now();
          ImmichDateRange range = resolve_immich_date_filter(
            id(immich_date_filter_enabled).state,
            id(immich_date_filter_mode).current_option(),
            (int) (id(immich_relative_amount).state + 0.5f),
            id(immich_relative_unit).current_option(),
            now.is_valid(), now.year, now.month, now.day_of_month,
            id(immich_date_from).state, id(immich_date_to).state);
          apply_immich_date_range(config, range);
          id(immich_filter_config) = config;

  - id: mark_photo_filter_custom
    mode: restart
    then:
      - lambda: |-
          if (id(immich_filter_preset_adapter_active)) return;
          if (id(photo_source_select).current_option() == "Custom") return;
          auto call = id(photo_source_select).make_call();
          call.set_option("Custom");
          call.perform();

  - id: apply_legacy_photo_source_preset
    mode: restart
    then:
      - lambda: |-
          const std::string source = id(photo_source_select).current_option();
          if (source == "Custom") return;
          id(immich_filter_preset_adapter_active) = true;
          auto set_switch = [](auto *control, bool enabled) {
            if (enabled) control->turn_on(); else control->turn_off();
          };
          auto set_option = [](auto *control, const char *option) {
            auto call = control->make_call();
            call.set_option(option);
            call.perform();
          };
          set_switch(id(immich_albums_enabled), source == "Album");
          set_switch(id(immich_people_enabled), source == "Person");
          set_switch(id(immich_tags_enabled), source == "Tag");
          set_option(id(immich_inclusion_matching), "Match all enabled groups");
          set_option(id(immich_album_matching), "Any selected album");
          set_option(id(immich_person_matching), "Any selected person");
          set_option(id(immich_tag_matching), "Any selected tag");
          auto favorite = id(immich_favorite_mode).make_call();
          favorite.set_option(source == "Favorites" ? "Favorites only" : "Any");
          favorite.perform();
          auto rating = id(immich_minimum_rating).make_call();
          rating.set_option("Any");
          rating.perform();
          id(immich_filter_country).publish_state("");
          id(immich_filter_state).publish_state("");
          id(immich_filter_city).publish_state("");
          id(immich_excluded_album_ids).publish_state("");
          id(immich_excluded_person_ids).publish_state("");
          id(immich_excluded_tag_ids).publish_state("");
          global_preferences->sync();
          if (source == "Memories") {
            id(immich_memories_migration_notice).turn_on();
            auto all_photos = id(photo_source_select).make_call();
            all_photos.set_option("All Photos");
            all_photos.perform();
          }
          id(immich_filter_preset_adapter_active) = false;

  - id: flush_slots_and_refetch
    mode: single
    then:
      - script.execute: sync_immich_filter_config
      - delay: 1ms
      - lambda: |-
          id(immich_request_state).empty_branch_attempts = 0;
          id(immich_request_state).filter_apply_pending = true;
      - if:
          condition:
            lambda: |-
              const auto &config = id(immich_filter_config);
              return immich_filter_has_missing_enabled_ids(config) ||
                !immich_filter_location_is_valid(config) ||
                (id(immich_request_state).api_generation == ImmichApiGeneration::V31_FLAT &&
                 immich_filter_requires_v32(config));
          then:
            - logger.log:
                level: DEBUG
                tag: immich
                format: "Photo source apply deferred until source IDs are restored"
            - script.execute: show_photo_source_empty_state
            - script.execute: immich_retry_config_ready
            - script.stop: flush_slots_and_refetch
      - script.execute: hide_photo_source_empty_state
      - lambda: |-
          id(immich_request_state).filter_apply_pending = false;
          // Album metadata fallback pages depend on the active source and
          // filters, so discard their RAM-only cursors whenever this applies.
          id(immich_request_state).reset_album_metadata_fallbacks();
          id(immich_request_state).invalidate_photo_source_requests();
          id(immich_candidate_pool).clear();
          // A flush discards every slot, so it has to discard the work that was
          // filling them too. Clearing `ready` while leaving fetch_in_flight set
          // orphans the flag: request_prefetch() and the slideshow interval both
          // gate on it, so the refill this flush is about to request either
          // defers or never runs at all. Abort the downloads and clear the
          // tracking first.
          id(immich_img_0).abort_download();
          id(immich_img_1).abort_download();
          id(immich_img_2).abort_download();
          id(immich_portrait_left).abort_download();
          id(immich_portrait_right).abort_download();
          id(immich_portrait_preload_left).abort_download();
          id(immich_portrait_preload_right).abort_download();
          clear_slot_fetch_in_flight(0, id(espframe_core).slideshow().state().slot_flags);
          clear_slot_fetch_in_flight(1, id(espframe_core).slideshow().state().slot_flags);
          clear_slot_fetch_in_flight(2, id(espframe_core).slideshow().state().slot_flags);
          id(espframe_core).slideshow().state().slot0.ready = false;
          id(espframe_core).slideshow().state().slot1.ready = false;
          id(espframe_core).slideshow().state().slot2.ready = false;
          id(espframe_core).slideshow().state().portrait_preload_slot = -1;
          id(espframe_core).slideshow().state().portrait_preload_left_ready = false;
          id(espframe_core).slideshow().state().portrait_preload_right_ready = false;
          // Same reasoning for the non-critical update tracking: the flush
          // cancels every outstanding update, so the per-slot flags and the
          // counter both have to go, not just the preload flag. Clearing them
          // together is what makes zeroing the counter safe — clear_noncritical()
          // only decrements when the slot's flag is still set, so a completion
          // arriving after the flush finds the flag already false and leaves the
          // counter alone. Left partially reset, a stuck non-zero count makes
          // both request_prefetch() and prepare_deferred_slot_update() refuse to
          // do any further work.
          id(espframe_core).slideshow().state().slot_flags.noncritical_update[0] = false;
          id(espframe_core).slideshow().state().slot_flags.noncritical_update[1] = false;
          id(espframe_core).slideshow().state().slot_flags.noncritical_update[2] = false;
          id(espframe_core).slideshow().state().preload_noncritical_in_flight = false;
          id(espframe_core).slideshow().state().noncritical_remote_updates_in_flight = 0;
          id(espframe_core).slideshow().state().active_slot_displayed = false;
          id(espframe_core).slideshow().state().target_slot = id(espframe_core).slideshow().state().active_slot;
      - script.execute: immich_fetch_into_slot

  - id: auto_apply_photo_source
    mode: restart
    then:
      - delay: 1s
      - lambda: 'ESP_LOGI("immich", "Photo source auto-applied — flushing all slots");'
      - script.execute: flush_slots_and_refetch
