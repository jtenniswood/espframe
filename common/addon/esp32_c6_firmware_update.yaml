# =============================================================================
# ESP32-C6 CO-PROCESSOR FIRMWARE UPDATE
# =============================================================================
# Adds automatic and manual ESP32-C6 hosted firmware updates on ESP32-P4
# devices that use an ESP32-C6 Wi-Fi co-processor. Automatic installation is
# enabled by default and can be disabled from the setup page or Home Assistant.
# =============================================================================

globals:
  - id: c6_manual_check_only
    type: bool
    initial_value: 'false'

update:
  - platform: esp32_hosted
    id: esp32_c6_update
    type: http
    http_request_id: http_req
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: 24h
    on_update_available:
      then:
        - if:
            condition:
              lambda: 'return id(c6_auto_update_switch).state && !id(c6_manual_check_only);'
            then:
              - logger.log:
                  level: WARN
                  format: "Automatically installing ESP32-C6 firmware update..."
              - update.perform:
                  id: esp32_c6_update

switch:
  - platform: template
    name: "WiFi Firmware: Auto Update"
    id: c6_auto_update_switch
    entity_category: config
    icon: "mdi:update"
    optimistic: true
    # ESPFRAME:SETTING_FIELDS c6_auto_update START
    restore_mode: RESTORE_DEFAULT_ON
    # ESPFRAME:SETTING_FIELDS c6_auto_update END
    web_server:
      sorting_group_id: sg_wifi
    on_turn_on:
      - update.check:
          id: esp32_c6_update

text_sensor:
  - platform: template
    name: "ESP32-C6: Update Available"
    entity_category: diagnostic
    id: c6_update_available
    icon: "mdi:update"
    web_server:
      sorting_group_id: sg_wifi
    lambda: |-
      auto upd = id(esp32_c6_update);
      if (!upd) return std::string("Unknown");
      if (upd->state == esphome::update::UpdateState::UPDATE_STATE_UNKNOWN)
        return std::string("Unknown");
      if (upd->state == esphome::update::UpdateState::UPDATE_STATE_INSTALLING)
        return std::string("Installing");
      if (upd->state == esphome::update::UpdateState::UPDATE_STATE_AVAILABLE)
        return std::string("Update available");
      if (upd->state == esphome::update::UpdateState::UPDATE_STATE_NO_UPDATE)
        return std::string("Up-to-date");
      return std::string("Unknown");
    update_interval: 60s

  - platform: template
    name: "ESP32-C6: Current Firmware"
    entity_category: diagnostic
    id: c6_update_current_firmware
    icon: "mdi:chip"
    web_server:
      sorting_group_id: sg_wifi
    lambda: |-
      auto upd = id(esp32_c6_update);
      if (!upd) return std::string("Unknown");
      auto &cur = upd->update_info.current_version;
      if (cur.empty()) return std::string("Unknown");
      return cur;
    update_interval: 60s

  - platform: template
    name: "ESP32-C6: Available Firmware"
    entity_category: diagnostic
    id: c6_update_latest_firmware
    icon: "mdi:chip"
    web_server:
      sorting_group_id: sg_wifi
    lambda: |-
      auto upd = id(esp32_c6_update);
      if (!upd) return std::string("Unknown");
      auto &lat = upd->update_info.latest_version;
      if (lat.empty()) return std::string("Unknown");
      return lat;
    update_interval: 60s

button:
  - platform: template
    name: "Firmware ESP32-C6: Install Update"
    entity_category: config
    icon: "mdi:download"
    web_server:
      sorting_group_id: sg_wifi
    on_press:
      then:
        - logger.log:
            level: WARN
            format: "Installing ESP32-C6 firmware update..."
        - update.perform:
            id: esp32_c6_update

  - platform: template
    name: "Firmware ESP32-C6: Check for Update"
    entity_category: config
    icon: "mdi:update"
    web_server:
      sorting_group_id: sg_wifi
    on_press:
      then:
        - logger.log:
            level: WARN
            format: "Checking if ESP32-C6 firmware update is available..."
        - lambda: 'id(c6_manual_check_only) = true;'
        - update.check:
            id: esp32_c6_update
        - delay: 15s
        - lambda: 'id(c6_manual_check_only) = false;'
