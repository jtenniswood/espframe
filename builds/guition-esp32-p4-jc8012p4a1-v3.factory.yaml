# =============================================================================
# FACTORY FIRMWARE - Guition ESP32-P4 JC8012P4A1 new panel
# =============================================================================
# Secrets-free config for the ESPHome web installer. Boots into AP mode for
# captive portal WiFi setup. This CI build is not used locally.
# Use for rear-case marking 2628+; keep the original build for 2627 or lower.
# =============================================================================

substitutions:
  name: "immich-frame-10inch-v3"
  friendly_name: "Espframe 10inch New Panel V3"
  firmware_version: "0.0.0"
  # Build wrappers compile this checked-out repo directly so PR/CI builds do
  # not depend on upstream main having the new component revision yet.
  espframe_component_url: "file:///config"
  espframe_component_ref: "HEAD"

packages:
  espframe: !include ../devices/guition-esp32-p4-jc8012p4a1-v3/packages.yaml

external_components:
  - source:
      type: local
      path: ../components
    components: [gsl3680, remote_image, ledc, espframe]

web_server:
  port: 80
  version: 3
  js_url: ""
  css_include: "../docs/public/webserver/style.css"
  js_include: "../docs/public/webserver/app.js"
