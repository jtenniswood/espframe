name: Build Release
run-name: ${{ inputs.publish && github.ref_type == 'tag' && format('Publish firmware {0}', github.ref_name) || format('Build firmware candidate {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the existing draft for the selected tag after verifying its firmware
        type: boolean
        default: false

concurrency:
  group: firmware-release-${{ github.ref }}

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-metadata:
    name: Read Product Release Metadata
    runs-on: espframe
    timeout-minutes: 5
    outputs:
      release_matrix: ${{ steps.product.outputs.release_matrix }}
      device_slugs: ${{ steps.product.outputs.device_slugs }}
      esphome_docker_image: ${{ steps.product.outputs.esphome_docker_image }}
      esphome_version: ${{ steps.product.outputs.esphome_version }}
      esphome_config_mount: ${{ steps.product.outputs.esphome_config_mount }}
      esphome_docker_remove_flag: ${{ steps.product.outputs.esphome_docker_remove_flag }}
      release_esphome_cache_dir: ${{ steps.product.outputs.release_esphome_cache_dir }}
      release_esphome_cache_key_prefix: ${{ steps.product.outputs.release_esphome_cache_key_prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/product_config.py
            product/contract/devices.json
            product/contract/manifest.json
            product/contract/project.json
            product/contract/settings.json
          sparse-checkout-cone-mode: false

      - name: Read product metadata
        id: product
        run: python3 scripts/product_config.py github-output >> "$GITHUB_OUTPUT"

  release-notes:
    name: Update Release Notes
    if: inputs.publish && github.ref_type == 'tag'
    runs-on: espframe
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Require an existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: test "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = true

      - name: Build detailed changelog
        env:
          VERSION: ${{ github.ref_name }}
        run: python3 scripts/release_changelog.py "$VERSION" --output "$RUNNER_TEMP/release-notes.md"

      - name: Update GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: gh release edit "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

  build-firmware:
    name: Build espframe
    needs: release-metadata
    runs-on: espframe
    timeout-minutes: 30
    env:
      ESPHOME_DOCKER_IMAGE: ${{ needs.release-metadata.outputs.esphome_docker_image }}
      ESPHOME_VERSION: ${{ needs.release-metadata.outputs.esphome_version }}
      ESPHOME_CONFIG_MOUNT: ${{ needs.release-metadata.outputs.esphome_config_mount }}
      ESPHOME_DOCKER_REMOVE_FLAG: ${{ needs.release-metadata.outputs.esphome_docker_remove_flag }}
      RELEASE_ESPHOME_CACHE_DIR: ${{ needs.release-metadata.outputs.release_esphome_cache_dir }}
      RELEASE_ESPHOME_CACHE_KEY_PREFIX: ${{ needs.release-metadata.outputs.release_esphome_cache_key_prefix }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.release-metadata.outputs.release_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Reclaim runner Docker storage
        run: |
          set -euo pipefail
          docker system df || true
          docker container prune -f
          docker image prune -af
          docker builder prune -af --keep-storage 2GB
          docker volume prune --all --force
          docker pull "${ESPHOME_DOCKER_IMAGE}:${ESPHOME_VERSION}"
          docker system df

      - name: Cache ESPHome build
        uses: actions/cache@v6
        with:
          path: ${{ needs.release-metadata.outputs.release_esphome_cache_dir }}
          key: ${{ needs.release-metadata.outputs.release_esphome_cache_key_prefix }}-${{ matrix.slug }}-${{ hashFiles('builds/*.yaml', 'common/**', 'devices/**', 'components/**') }}
          restore-keys: |
            ${{ needs.release-metadata.outputs.release_esphome_cache_key_prefix }}-${{ matrix.slug }}-

      - name: Build legacy-layout native firmware
        env:
          NATIVE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.{0}.{1}', github.run_number, github.run_attempt) }}
          DEVICE_SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          if [[ ! "$NATIVE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          case "$DEVICE_SLUG" in
            immich-frame) board=v1 ;;
            immich-frame-v2) board=v2 ;;
            immich-frame-v3) board=v3 ;;
            *) exit 1 ;;
          esac
          mkdir -p output
          native_volume="espframe-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$board"
          native_container=""
          cleanup_native_build() {
            if [ -n "$native_container" ]; then
              docker rm -f "$native_container" >/dev/null 2>&1 || true
            fi
            docker volume rm "$native_volume" >/dev/null 2>&1 || true
          }
          trap cleanup_native_build EXIT
          docker volume create "$native_volume" >/dev/null
          native_container=$(docker create \
            --mount "type=volume,source=$native_volume,target=/workspace" -w /workspace espressif/idf:v6.1.1 \
            idf.py -C firmware/native -B /workspace/native-build -D "SWIPE_BOARD=$board" \
            -D NATIVE_LEGACY_MIGRATION=ON -D "NATIVE_STABLE_VERSION=$NATIVE_VERSION" build)
          git archive "$GITHUB_SHA" | docker cp - "$native_container:/workspace"
          docker start -a "$native_container"
          asset="$board-legacy-native.bin"
          docker cp "$native_container:/workspace/native-build/espframe_legacy_$board.bin" "output/$asset"
          pins=$(python3 scripts/native_stable_releases.py pins "output/$asset" "$board" "$NATIVE_VERSION")
          read -r checksum fingerprint <<< "$pins"
          {
            echo "MIGRATION_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$NATIVE_VERSION/$asset"
            echo "MIGRATION_MD5=$checksum"
            echo "MIGRATION_ELF=$fingerprint"
          } >> "$GITHUB_ENV"

      - name: Compile firmware
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-candidate.{0}.{1}', github.run_id, github.run_attempt) }}
        run: |
          set -euo pipefail
          python3 scripts/firmware_release.py inject \
            --slug "${{ matrix.slug }}" \
            --version "${VERSION}"

          mkdir -p output
          image="${ESPHOME_DOCKER_IMAGE}:${ESPHOME_VERSION}"
          workspace_volume="espframe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.slug }}"
          staging_container=""

          cleanup_workspace() {
            if [ -n "${staging_container}" ]; then
              docker rm -f "${staging_container}" >/dev/null 2>&1 || true
            fi
            docker volume rm -f "${workspace_volume}" >/dev/null 2>&1 || true
          }
          trap cleanup_workspace EXIT

          docker volume create "${workspace_volume}" >/dev/null
          staging_container=$(docker create \
            --user "$(id -u):$(id -g)" \
            --mount "type=volume,source=${workspace_volume},target=${ESPHOME_CONFIG_MOUNT}" \
            --entrypoint /bin/true \
            "${image}")
          docker cp --archive "${PWD}/." "${staging_container}:${ESPHOME_CONFIG_MOUNT}"
          docker rm "${staging_container}" >/dev/null
          staging_container=""
          rm -rf "${RELEASE_ESPHOME_CACHE_DIR}"
          mkdir -p "${RELEASE_ESPHOME_CACHE_DIR}"

          compile_in_isolated_container() {
            local config_file="$1"
            local profile="$2"
            local binary_name="$3"
            local log_file="output/${{ matrix.slug }}.${profile}.log"
            local output_binary="output/${{ matrix.slug }}.${profile}.bin"
            local -a migration=()
            if [ "$profile" = ota ] && [ -n "${MIGRATION_URL:-}" ]; then
              config_file="${config_file%.yaml}.native-migration-bridge.yaml"
              migration=(-s native_migration_enabled true -s native_migration_url "$MIGRATION_URL"
                -s native_migration_md5 "$MIGRATION_MD5" -s native_migration_elf "$MIGRATION_ELF")
            fi
            local container
            container=$(docker create \
              --user "$(id -u):$(id -g)" \
              -e HOME="${ESPHOME_CONFIG_MOUNT}" \
              -e PLATFORMIO_SETTING_ENABLE_TELEMETRY=false \
              --mount "type=volume,source=${workspace_volume},target=${ESPHOME_CONFIG_MOUNT}" \
              "${image}" \
              -s firmware_version "${VERSION}" \
              -s espframe_component_url "file://${ESPHOME_CONFIG_MOUNT}" \
              -s espframe_component_ref HEAD "${migration[@]}" \
              compile "${ESPHOME_CONFIG_MOUNT}/builds/${config_file}")

            cleanup_container() {
              docker rm -f "${container}" >/dev/null 2>&1 || true
            }
            trap cleanup_container RETURN

            set +e
            docker start -a "${container}" 2>&1 | tee "${log_file}"
            local status=${PIPESTATUS[0]}
            set -e
            if [ "${status}" -ne 0 ]; then
              return "${status}"
            fi

            local container_build_dir="${ESPHOME_CONFIG_MOUNT}/${RELEASE_ESPHOME_CACHE_DIR}/build/${{ matrix.build_name }}/build"
            if ! docker cp "${container}:${container_build_dir}/${binary_name}" "${output_binary}"; then
              echo "::error::Firmware compilation failed - ${binary_name} not found"
              return 1
            fi

          }

          compile_in_isolated_container \
            "${{ matrix.yaml }}.factory.yaml" factory firmware.factory.bin
          python3 scripts/check_build_budgets.py \
            --compile-log "output/${{ matrix.slug }}.factory.log" \
            --profile factory \
            --binary "output/${{ matrix.slug }}.factory.bin"

          compile_in_isolated_container \
            "${{ matrix.yaml }}.yaml" ota firmware.ota.bin
          python3 scripts/check_build_budgets.py \
            --compile-log "output/${{ matrix.slug }}.ota.log" \
            --profile ota \
            --binary "output/${{ matrix.slug }}.ota.bin"

          staging_container=$(docker create \
            --mount "type=volume,source=${workspace_volume},target=${ESPHOME_CONFIG_MOUNT}" \
            --entrypoint /bin/true \
            "${image}")
          docker cp "${staging_container}:${ESPHOME_CONFIG_MOUNT}/${RELEASE_ESPHOME_CACHE_DIR}/." \
            "${RELEASE_ESPHOME_CACHE_DIR}"
          docker rm "${staging_container}" >/dev/null
          staging_container=""

      - name: Fix ESPHome cache permissions
        if: always()
        run: |
          if [ -d "${RELEASE_ESPHOME_CACHE_DIR}" ]; then
            chmod -R u+rwX "${RELEASE_ESPHOME_CACHE_DIR}"
          fi

      - name: Collect firmware files and generate manifest
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-candidate.{0}.{1}', github.run_id, github.run_attempt) }}
        run: |
          mkdir -p output

          if [ ! -f "output/${{ matrix.slug }}.ota.bin" ]; then
            echo "::error::Firmware compilation failed - OTA binary not found"
            exit 1
          fi

          python3 scripts/firmware_release.py manifest \
            --slug "${{ matrix.slug }}" \
            --chip "${{ matrix.chip }}" \
            --version "${VERSION}" \
            --factory "output/${{ matrix.slug }}.factory.bin" \
            --ota "output/${{ matrix.slug }}.ota.bin" \
            --source-commit "$GITHUB_SHA" \
            --out "output/${{ matrix.slug }}.manifest.json"

          python3 scripts/firmware_release.py verify-files \
            --slug "${{ matrix.slug }}" \
            --version "${VERSION}" \
            --manifest "output/${{ matrix.slug }}.manifest.json" \
            --factory "output/${{ matrix.slug }}.factory.bin" \
            --ota "output/${{ matrix.slug }}.ota.bin"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.slug }}
          path: output/

  assemble-candidate:
    name: Assemble verified firmware candidate
    needs: [build-firmware, release-metadata]
    runs-on: espframe
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated assets at the candidate revision
        shell: bash
        run: |
          set -euo pipefail
          tzdata_venv="${RUNNER_TEMP}/espframe-release-tzdata"
          python3 -m venv "$tzdata_venv"
          "$tzdata_venv/bin/python" -m pip install --disable-pip-version-check "tzdata==2026.3"
          tzdata_site=$("$tzdata_venv/bin/python" -c 'import site; print(site.getsitepackages()[0])')
          export PYTHONPATH="$tzdata_site${PYTHONPATH:+:$PYTHONPATH}"
          export PYTHONTZPATH="$tzdata_site/tzdata/zoneinfo"
          npm run check:generated

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: board-builds

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-candidate/firmware
          cp board-builds/*.manifest.json board-builds/*.factory.bin board-builds/*.ota.bin release-candidate/firmware/

      - name: Verify assembled release assets
        working-directory: release-candidate
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-candidate.{0}.{1}', github.run_id, github.run_attempt) }}
          DEVICE_SLUGS: ${{ needs.release-metadata.outputs.device_slugs }}
        run: >-
          python3 ../scripts/firmware_release.py verify-directory
          --version "${VERSION}"
          --dir firmware
          --exact
          --source-commit "$GITHUB_SHA"
          --slugs $DEVICE_SLUGS

      - name: Verify legacy native candidates
        env:
          NATIVE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.{0}.{1}', github.run_number, github.run_attempt) }}
        run: |
          if [[ "$NATIVE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            mkdir native
            cp board-builds/*-legacy-native.bin native/
            python3 scripts/native_stable_releases.py verify-bridges release-candidate/firmware native "$GITHUB_REPOSITORY" "$NATIVE_VERSION"
          fi

      - name: Upload verified firmware candidate
        uses: actions/upload-artifact@v7
        with:
          name: verified-firmware-candidate
          path: |
            release-candidate/firmware/*.manifest.json
            release-candidate/firmware/*.factory.bin
            release-candidate/firmware/*.ota.bin
          if-no-files-found: error

      - name: Upload verified stable native candidate
        if: ${{ github.ref_type != 'tag' || !contains(github.ref_name, '-') }}
        uses: actions/upload-artifact@v7
        with:
          name: verified-stable-native-candidate
          path: native/*-legacy-native.bin
          if-no-files-found: error

  publish:
    name: Publish to Release
    if: inputs.publish && github.ref_type == 'tag'
    needs: [assemble-candidate, release-metadata, release-notes]
    runs-on: espframe
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/firmware_release.py
            scripts/product_config.py
            product/contract/devices.json
            product/contract/manifest.json
            product/contract/project.json
            product/contract/settings.json
          sparse-checkout-cone-mode: false

      - name: Download verified firmware candidate
        uses: actions/download-artifact@v8
        with:
          name: verified-firmware-candidate
          path: firmware

      - name: Download verified stable native candidate
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/download-artifact@v8
        with:
          name: verified-stable-native-candidate
          path: native

      - name: Verify assembled release assets
        env:
          VERSION: ${{ github.ref_name }}
          DEVICE_SLUGS: ${{ needs.release-metadata.outputs.device_slugs }}
        run: >-
          python3 scripts/firmware_release.py verify-directory
          --version "${VERSION}"
          --dir firmware
          --exact
          --slugs $DEVICE_SLUGS

      - name: Require an existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: test "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = true

      - name: Upload firmware to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: gh release upload "$VERSION" firmware/* --clobber

      - name: Upload native firmware to release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git show HEAD:scripts/native_stable_releases.py > "$RUNNER_TEMP/native_stable_releases.py"
          python3 "$RUNNER_TEMP/native_stable_releases.py" verify native "$VERSION"
          gh release upload "$VERSION" native/*-legacy-native.bin --clobber

      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          DEVICE_SLUGS: ${{ needs.release-metadata.outputs.device_slugs }}
        run: |
          mkdir -p published
          gh release download "${VERSION}" \
            --pattern "*.manifest.json" \
            --pattern "*.factory.bin" \
            --pattern "*.ota.bin" \
            --dir published
          python3 scripts/firmware_release.py verify-directory \
            --version "${VERSION}" \
            --dir published \
            --exact \
            --slugs $DEVICE_SLUGS

          for asset in firmware/*; do
            cmp "$asset" "published/${asset##*/}"
          done
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            mkdir published-native
            gh release download "$VERSION" --pattern "v[123]-legacy-native.bin" --dir published-native
            python3 "$RUNNER_TEMP/native_stable_releases.py" verify published-native "$VERSION"
            for asset in native/*-legacy-native.bin; do
              cmp "$asset" "published-native/${asset##*/}"
            done
          fi

      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: gh release edit "$VERSION" --draft=false
