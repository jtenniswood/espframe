name: Build Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-metadata:
    name: Read Product Release Metadata
    runs-on: espframe
    timeout-minutes: 5
    outputs:
      release_matrix: ${{ steps.product.outputs.release_matrix }}
      device_slugs: ${{ steps.product.outputs.device_slugs }}
      esphome_docker_image: ${{ steps.product.outputs.esphome_docker_image }}
      esphome_version: ${{ steps.product.outputs.esphome_version }}
      esphome_config_mount: ${{ steps.product.outputs.esphome_config_mount }}
      esphome_docker_remove_flag: ${{ steps.product.outputs.esphome_docker_remove_flag }}
      release_esphome_cache_dir: ${{ steps.product.outputs.release_esphome_cache_dir }}
      release_esphome_cache_key_prefix: ${{ steps.product.outputs.release_esphome_cache_key_prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          sparse-checkout: |
            scripts/product_config.py
            product/contract/devices.json
            product/contract/manifest.json
            product/contract/project.json
            product/contract/settings.json
          sparse-checkout-cone-mode: false

      - name: Read product metadata
        id: product
        run: python3 scripts/product_config.py github-output >> "$GITHUB_OUTPUT"

  release-notes:
    name: Update Release Notes
    if: github.event_name == 'release'
    runs-on: espframe
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build detailed changelog
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: python3 scripts/release_changelog.py "$VERSION" --output "$RUNNER_TEMP/release-notes.md"

      - name: Update GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.event.release.tag_name }}
        run: gh release edit "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

  build-firmware:
    name: Build ${{ matrix.slug }}
    needs: release-metadata
    runs-on: espframe
    timeout-minutes: 30
    env:
      ESPHOME_DOCKER_IMAGE: ${{ needs.release-metadata.outputs.esphome_docker_image }}
      ESPHOME_VERSION: ${{ needs.release-metadata.outputs.esphome_version }}
      ESPHOME_CONFIG_MOUNT: ${{ needs.release-metadata.outputs.esphome_config_mount }}
      ESPHOME_DOCKER_REMOVE_FLAG: ${{ needs.release-metadata.outputs.esphome_docker_remove_flag }}
      RELEASE_ESPHOME_CACHE_DIR: ${{ needs.release-metadata.outputs.release_esphome_cache_dir }}
      RELEASE_ESPHOME_CACHE_KEY_PREFIX: ${{ needs.release-metadata.outputs.release_esphome_cache_key_prefix }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.release-metadata.outputs.release_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Cache ESPHome build
        uses: actions/cache@v6
        with:
          path: ${{ needs.release-metadata.outputs.release_esphome_cache_dir }}
          key: ${{ needs.release-metadata.outputs.release_esphome_cache_key_prefix }}-${{ matrix.slug }}-${{ hashFiles('builds/*.yaml', 'common/**', 'devices/**', 'components/**') }}
          restore-keys: |
            ${{ needs.release-metadata.outputs.release_esphome_cache_key_prefix }}-${{ matrix.slug }}-

      - name: Compile firmware
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/firmware_release.py inject \
            --slug "${{ matrix.slug }}" \
            --version "${VERSION}"

          mkdir -p output

          compile_in_isolated_container() {
            local config_file="$1"
            local profile="$2"
            local binary_name="$3"
            local log_file="output/${{ matrix.slug }}.${profile}.log"
            local output_binary="output/${{ matrix.slug }}.${profile}.bin"
            local image="${ESPHOME_DOCKER_IMAGE}:${ESPHOME_VERSION}"
            local container
            container=$(docker create \
              --user "$(id -u):$(id -g)" \
              -e HOME="${ESPHOME_CONFIG_MOUNT}" \
              -e PLATFORMIO_SETTING_ENABLE_TELEMETRY=false \
              "${image}" \
              -s firmware_version "${VERSION}" \
              compile "${ESPHOME_CONFIG_MOUNT}/builds/${config_file}")

            cleanup_container() {
              docker rm -f "${container}" >/dev/null 2>&1 || true
            }
            trap cleanup_container RETURN

            docker cp "${PWD}/." "${container}:${ESPHOME_CONFIG_MOUNT}"
            set +e
            docker start -a "${container}" 2>&1 | tee "${log_file}"
            local status=${PIPESTATUS[0]}
            set -e
            if [ "${status}" -ne 0 ]; then
              return "${status}"
            fi

            local container_build_dir="${ESPHOME_CONFIG_MOUNT}/${RELEASE_ESPHOME_CACHE_DIR}/build/${{ matrix.build_name }}/build"
            if ! docker cp "${container}:${container_build_dir}/${binary_name}" "${output_binary}"; then
              echo "::error::Firmware compilation failed - ${binary_name} not found"
              return 1
            fi

            rm -rf "${RELEASE_ESPHOME_CACHE_DIR}"
            mkdir -p "${RELEASE_ESPHOME_CACHE_DIR}"
            docker cp "${container}:${ESPHOME_CONFIG_MOUNT}/${RELEASE_ESPHOME_CACHE_DIR}/." \
              "${RELEASE_ESPHOME_CACHE_DIR}"
          }

          compile_in_isolated_container \
            "${{ matrix.yaml }}.factory.yaml" factory firmware.factory.bin
          python3 scripts/check_build_budgets.py \
            --compile-log "output/${{ matrix.slug }}.factory.log" \
            --profile factory \
            --binary "output/${{ matrix.slug }}.factory.bin"

          compile_in_isolated_container \
            "${{ matrix.yaml }}.yaml" ota firmware.ota.bin
          python3 scripts/check_build_budgets.py \
            --compile-log "output/${{ matrix.slug }}.ota.log" \
            --profile ota \
            --binary "output/${{ matrix.slug }}.ota.bin"

      - name: Fix ESPHome cache permissions
        if: always()
        run: |
          if [ -d "${RELEASE_ESPHOME_CACHE_DIR}" ]; then
            chmod -R u+rwX "${RELEASE_ESPHOME_CACHE_DIR}"
          fi

      - name: Collect firmware files and generate manifest
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          mkdir -p output

          if [ ! -f "output/${{ matrix.slug }}.ota.bin" ]; then
            echo "::error::Firmware compilation failed - OTA binary not found"
            exit 1
          fi

          python3 scripts/firmware_release.py manifest \
            --slug "${{ matrix.slug }}" \
            --chip "${{ matrix.chip }}" \
            --version "${VERSION}" \
            --factory "output/${{ matrix.slug }}.factory.bin" \
            --ota "output/${{ matrix.slug }}.ota.bin" \
            --out "output/${{ matrix.slug }}.manifest.json"

          python3 scripts/firmware_release.py verify-files \
            --slug "${{ matrix.slug }}" \
            --version "${VERSION}" \
            --manifest "output/${{ matrix.slug }}.manifest.json" \
            --factory "output/${{ matrix.slug }}.factory.bin" \
            --ota "output/${{ matrix.slug }}.ota.bin"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.slug }}
          path: output/

  publish:
    name: Publish to Release
    if: github.event_name == 'release'
    needs: [build-firmware, release-metadata]
    runs-on: espframe
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/firmware_release.py
            scripts/product_config.py
            product/contract/devices.json
            product/contract/manifest.json
            product/contract/project.json
            product/contract/settings.json
          sparse-checkout-cone-mode: false

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: firmware

      - name: Verify assembled release assets
        env:
          VERSION: ${{ github.event.release.tag_name }}
          DEVICE_SLUGS: ${{ needs.release-metadata.outputs.device_slugs }}
        run: >-
          python3 scripts/firmware_release.py verify-directory
          --version "${VERSION}"
          --dir firmware
          --slugs $DEVICE_SLUGS

      - name: Upload firmware to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" firmware/* --clobber

      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.event.release.tag_name }}
          DEVICE_SLUGS: ${{ needs.release-metadata.outputs.device_slugs }}
        run: |
          mkdir -p published
          gh release download "${VERSION}" \
            --pattern "*.manifest.json" \
            --pattern "*.factory.bin" \
            --pattern "*.ota.bin" \
            --dir published
          python3 scripts/firmware_release.py verify-directory \
            --version "${VERSION}" \
            --dir published \
            --slugs $DEVICE_SLUGS
