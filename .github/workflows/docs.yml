name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'product/**'
      - 'scripts/firmware_release.py'
      - 'scripts/product_config.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_run:
    workflows: ["Build Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-docs:
    name: Build Docs
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: docs/.vitepress/dist

  download-firmware:
    name: Download Firmware
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/firmware_release.py
            scripts/product_config.py
            product/contract/devices.json
            product/contract/manifest.json
            product/contract/project.json
            product/contract/settings.json
          sparse-checkout-cone-mode: false

      - name: Load product firmware metadata
        run: python3 scripts/product_config.py github-env >> "$GITHUB_ENV"

      - name: Set release metadata
        id: release-meta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_TAG=$(gh release view --json tagName -q .tagName)
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download firmware from latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          STABLE_SOURCE_DIR=$(mktemp -d)
          gh release download "$RELEASE_TAG" \
            --pattern "*.factory.bin" \
            --pattern "*.ota.bin" \
            --dir "$STABLE_SOURCE_DIR" \
            --clobber
          for SLUG in $DEVICE_SLUGS; do
            gh release download "$RELEASE_TAG" \
              --pattern "${SLUG}.manifest.json" \
              --dir "$STABLE_SOURCE_DIR" \
              --clobber 2>/dev/null || true
          done
          python3 scripts/firmware_release.py stage-directory \
            --source "$STABLE_SOURCE_DIR" \
            --dir . \
            --slugs $DEVICE_SLUGS \
            --allow-missing-slugs immich-frame-v2

          STABLE_RELEASE_TAGS=$(gh release list --limit 30 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName \
            -q '.[].tagName')

          if [ -z "$STABLE_RELEASE_TAGS" ]; then
            echo "::error::No stable firmware releases found"
            exit 1
          fi

          download_release_asset() {
            local release_tag="$1"
            local asset_name="$2"
            local output_dir="$3"
            gh release download "$release_tag" \
              --pattern "$asset_name" \
              --dir "$output_dir" \
              --clobber >/dev/null 2>&1
          }

          for SLUG in $DEVICE_SLUGS; do
            PUBLIC_MANIFEST=$(jq -r --arg slug "$SLUG" \
              '.[] | select(.slug == $slug) | .public_manifest' product/contract/devices.json)
            if [ ! -f "$PUBLIC_MANIFEST" ]; then
              continue
            fi
            PUBLIC_MANIFEST_DIR=$(dirname "$PUBLIC_MANIFEST")
            INDEX_ENTRIES=$(mktemp)
            : > "$INDEX_ENTRIES"
            VALID_COUNT=0

            while IFS= read -r CANDIDATE_TAG; do
              [ -n "$CANDIDATE_TAG" ] || continue
              if [[ ! "$CANDIDATE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                continue
              fi
              RELEASE_DIR=$(mktemp -d)
              MANIFEST_NAME="${SLUG}.manifest.json"

              if ! download_release_asset "$CANDIDATE_TAG" "$MANIFEST_NAME" "$RELEASE_DIR"; then
                if [ "$SLUG" != "$DEFAULT_DEVICE_SLUG" ] || \
                   ! download_release_asset "$CANDIDATE_TAG" "manifest.json" "$RELEASE_DIR"; then
                  continue
                fi
                MANIFEST_NAME="manifest.json"
              fi
              if ! download_release_asset "$CANDIDATE_TAG" "${SLUG}.ota.bin" "$RELEASE_DIR"; then
                continue
              fi

              MANIFEST_PATH="${RELEASE_DIR}/${MANIFEST_NAME}"
              VERSION=$(jq -r '.version // ""' "$MANIFEST_PATH")
              OTA_MD5=$(jq -r --arg path "${SLUG}.ota.bin" \
                'first((.builds // [])[]?.ota | select((.path // "") == $path) | (.md5 // "")) // ""' \
                "$MANIFEST_PATH")
              ACTUAL_OTA_MD5=$(md5sum "${RELEASE_DIR}/${SLUG}.ota.bin" | awk '{print $1}')
              RELEASE_URL=$(jq -r --arg path "${SLUG}.ota.bin" \
                'first((.builds // [])[]?.ota | select((.path // "") == $path) | (.release_url // "")) // ""' \
                "$MANIFEST_PATH")
              EXPECTED_RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${CANDIDATE_TAG}"
              if [ "$VERSION" != "$CANDIDATE_TAG" ] || \
                 [[ ! "$OTA_MD5" =~ ^[0-9a-f]{32}$ ]] || \
                 [ "$OTA_MD5" != "$ACTUAL_OTA_MD5" ] || \
                 { [ -n "$RELEASE_URL" ] && [ "$RELEASE_URL" != "$EXPECTED_RELEASE_URL" ]; } || \
                 jq -e --arg version "$VERSION" 'select(.version == $version)' \
                   "$INDEX_ENTRIES" >/dev/null 2>&1; then
                continue
              fi
              if [ "$VALID_COUNT" -eq 0 ] && [ "$CANDIDATE_TAG" != "$RELEASE_TAG" ]; then
                continue
              fi
              if [ -z "$RELEASE_URL" ]; then
                RELEASE_URL="$EXPECTED_RELEASE_URL"
              fi

              VERSION_PATH=$(printf '%s' "$VERSION" | sed 's/[^A-Za-z0-9._-]/_/g')
              if [ "$VALID_COUNT" -eq 0 ]; then
                OTA_INDEX_PATH="${SLUG}.ota.bin"
              else
                OTA_INDEX_PATH="versions/${VERSION_PATH}/${SLUG}.ota.bin"
                mkdir -p "${PUBLIC_MANIFEST_DIR}/versions/${VERSION_PATH}"
                cp "${RELEASE_DIR}/${SLUG}.ota.bin" \
                  "${PUBLIC_MANIFEST_DIR}/versions/${VERSION_PATH}/${SLUG}.ota.bin"
              fi

              jq -n \
                --arg version "$VERSION" \
                --arg release_url "$RELEASE_URL" \
                --arg ota_path "$OTA_INDEX_PATH" \
                --arg ota_md5 "$OTA_MD5" \
                '{version:$version,release_url:$release_url,ota:{path:$ota_path,md5:$ota_md5}}' \
                >> "$INDEX_ENTRIES"
              VALID_COUNT=$((VALID_COUNT + 1))
              if [ "$VALID_COUNT" -ge 5 ]; then break; fi
            done <<< "$STABLE_RELEASE_TAGS"

            if [ "$VALID_COUNT" -eq 0 ]; then
              echo "::error::No complete stable firmware releases found for ${SLUG}"
              exit 1
            fi

            jq -s --arg device "$SLUG" '{device:$device,versions:.}' \
              "$INDEX_ENTRIES" > "${PUBLIC_MANIFEST_DIR}/versions.json"
          done

      - name: Download firmware from latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          BETA_TAG=$(gh release list --limit 20 --json tagName,isPrerelease \
            -q '[.[] | select(.isPrerelease)] | .[0].tagName // empty')
          if [ -n "$BETA_TAG" ]; then
            BETA_MANIFEST_DIR=$(dirname "$DEFAULT_PUBLIC_BETA_MANIFEST")
            mkdir -p "$BETA_MANIFEST_DIR"
            gh release download "$BETA_TAG" \
              --pattern "*.factory.bin" \
              --pattern "*.ota.bin" \
              --dir "$BETA_MANIFEST_DIR" \
              --clobber 2>/dev/null || true
            for SLUG in $DEVICE_SLUGS; do
              gh release download "$BETA_TAG" \
                --pattern "${SLUG}.manifest.json" \
                --dir "$BETA_MANIFEST_DIR" \
                --clobber 2>/dev/null || true
            done
            python3 scripts/firmware_release.py stage-directory \
              --source "$BETA_MANIFEST_DIR" \
              --dir . \
              --slugs $DEVICE_SLUGS \
              --beta \
              --allow-missing
          fi

      - name: Verify firmware assets
        run: >-
          python3 scripts/firmware_release.py verify-directory
          --version "$RELEASE_TAG"
          --dir firmware
          --slugs $DEVICE_SLUGS
          --allow-missing-slugs immich-frame-v2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware/

  deploy-docs:
    name: Deploy Docs
    needs: [build-docs, download-firmware]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/firmware_release.py
            scripts/product_config.py
            product/contract/devices.json
            product/contract/manifest.json
            product/contract/project.json
            product/contract/settings.json
          sparse-checkout-cone-mode: false

      - name: Load product docs metadata
        run: python3 scripts/product_config.py github-env >> "$GITHUB_ENV"

      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: dist

      - name: Clear bundled firmware placeholders
        run: rm -rf dist/firmware

      - name: Download firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist/firmware

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify public firmware
        run: >-
          python3 scripts/firmware_release.py verify-pages
          --version "${{ needs.download-firmware.outputs.release_tag }}"
          --base-url "$PUBLIC_BASE_URL"
          --slugs $DEVICE_SLUGS
          --retries 10
          --delay 15
          --allow-missing-slugs immich-frame-v2
