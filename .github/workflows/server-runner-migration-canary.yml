name: NET-50 runner credential canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-canary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: github-runner-espframe
            name: github-runner-espframe
    runs-on:
      - self-hosted
      - Linux
      - X64
      - espframe
      - runner
      - ${{ matrix.label }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify exact runner, checkout, workspace, and credential isolation
        shell: bash
        env:
          ACTUAL_RUNNER_NAME: ${{ runner.name }}
          EXPECTED_RUNNER_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          test "$ACTUAL_RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          test -z "${ACCESS_TOKEN:-}"
          marker="${GITHUB_WORKSPACE}/.net50-canary-${GITHUB_RUN_ID}-${EXPECTED_RUNNER_NAME}"
          printf '%s\n' "${GITHUB_RUN_ID}" > "$marker"
          test -s "$marker"
          rm -f "$marker"
          printf 'canary_runner=%s checkout=ok workspace_write=ok bootstrap_token_absent=ok\n' "$ACTUAL_RUNNER_NAME"
