name: Native Swipe Prototype
run-name: ${{ inputs.publish_preview && format('Publish native preview {0}', inputs.preview_version) || inputs.preview_version != '' && format('Build Native Preview {0}', inputs.preview_version) || github.event.pull_request.title || 'Native Swipe Prototype' }}

on:
  pull_request:
    paths:
      - 'firmware/native/**'
      - 'product/translations/**'
      - 'components/espframe/i18n.h'
      - 'components/espframe/date_utils.h'
      - 'builds/guition-esp32-p4-jc8012p4a1.native-trial-readiness.yaml'
      - 'components/gsl3680/**'
      - 'components/libjpeg-turbo-esp32/**'
      - 'components/libwebp-esp32/**'
      - 'components/remote_image/jpeg_accelerator_helpers.h'
      - 'components/remote_image/webp_rgb565.h'
      - 'components/espframe/timezones.py'
      - 'components/espframe/ntp_server_names.h'
      - 'components/espframe/configuration_contract_generated.h'
      - 'components/espframe/immich_filter_config.h'
      - 'components/espframe/immich_helpers.h'
      - 'docs/public/webserver/**'
      - 'components/espframe/solar_times.h'
      - 'components/espframe/warm_tone_luts.h'
      - 'devices/guition-esp32-p4-jc8012p4a1*/device/device.yaml'
      - 'components/mipi_dsi/models/guition.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-swipe.yml'
  workflow_dispatch:
    inputs:
      preview_version:
        description: Optional native preview version, such as v0.1.0-preview.1
        type: string
        default: ''
      preview_v1_linked_scanout:
        description: Use experimental linked scanout on V1 in this preview
        type: boolean
        default: false
      publish_preview:
        description: Publish a verified draft for the matching native preview tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  home-assistant:
    if: github.event_name != 'workflow_dispatch' || inputs.preview_version == ''
    name: Test encrypted native Home Assistant session
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Link for ESP32-P4 and test the ESPHome client on loopback
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace espressif/idf:v6.1.1 bash -ec '
            source=firmware/native/tests/home_assistant
            host=firmware/native/build/ha-host-ci
            idf.py -C "$source" -B /workspace/firmware/native/build/ha-link-ci build
            cmake -S "$source" -B "$host" -DESPFRAME_HA_HOST=ON \
              -DESPHOME_MANAGED_COMPONENTS="/workspace/$source/managed_components"
            cmake --build "$host" --parallel 4
            python -m venv /tmp/espframe-ha-client
            /tmp/espframe-ha-client/bin/pip install "aioesphomeapi==46.25.0"
            /tmp/espframe-ha-client/bin/python "$source/api_test.py" "$host/espframe_ha_host_test"
          '

  prepared-slides:
    if: github.event_name != 'workflow_dispatch' || inputs.preview_version == ''
    name: Test prepared Immich slides
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firmware/native/prepared-slides/package-lock.json
      - run: npm ci && npm run typecheck && npm test
        working-directory: firmware/native/prepared-slides
      - name: Compile V1 prepared and direct replay apps
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace espressif/idf:v6.1.1 bash -ec '
            idf.py -C firmware/native -B firmware/native/build/prepared-replay-ci \
              -D SWIPE_BOARD=v1 -D SWIPE_ESPHOME_TRIAL=ON -D SWIPE_TRIAL_IMMICH=ON \
              -D SWIPE_TRIAL_BENCHMARK=ON -D SWIPE_TRIAL_BENCHMARK_RAPID=ON \
              -D SWIPE_TRIAL_REPLAY_ORIGIN=http://127.0.0.1:9116 -D SWIPE_TRIAL_REPLAY_PREPARED=ON \
              -D SWIPE_TRIAL_REPLAY_HISTORY=ON -D SWIPE_TRIAL_REPLAY_PAIR_FILL=ON build
            idf.py -C firmware/native -B firmware/native/build/prepared-replay-ci \
              -D SWIPE_BOARD=v1 -D SWIPE_ESPHOME_TRIAL=ON -D SWIPE_TRIAL_IMMICH=ON \
              -D SWIPE_TRIAL_BENCHMARK=ON -D SWIPE_TRIAL_BENCHMARK_RAPID=ON \
              -D SWIPE_TRIAL_REPLAY_ORIGIN=http://127.0.0.1:9116 -D SWIPE_TRIAL_REPLAY_PREPARED=OFF \
              -D SWIPE_TRIAL_REPLAY_HISTORY=OFF -D SWIPE_TRIAL_REPLAY_DISABLE_COMPANION_PREFETCH=ON \
              -D SWIPE_TRIAL_REPLAY_PAIR_FILL=ON build
            idf.py -C firmware/native -B firmware/native/build/prepared-replay-ci \
              -D SWIPE_TRIAL_REPLAY_DISABLE_COMPANION_PREFETCH=OFF -D SWIPE_TRIAL_REPLAY_STAGED_DETAIL=ON build
            idf.py -C firmware/native -B firmware/native/build/prepared-replay-ci \
              -D SWIPE_TRIAL_REPLAY_EDGE_DETAIL=ON build
            idf.py -C firmware/native -B firmware/native/build/prepared-replay-ci \
              -D SWIPE_TRIAL_REPLAY_PREPARED=ON build
            idf.py -C firmware/native -B firmware/native/build/prepared-replay-ci \
              -D SWIPE_TRIAL_BENCHMARK=OFF -D SWIPE_TRIAL_BENCHMARK_RAPID=OFF -D SWIPE_TRIAL_REPLAY_TOUCH=ON \
              -D SWIPE_TRIAL_REPLAY_PREPARED=OFF -D SWIPE_TRIAL_REPLAY_EDGE_DETAIL=OFF build
          '

  linked-scanout:
    if: github.event_name != 'workflow_dispatch' || inputs.preview_version == ''
    name: Test experimental V1 linked scanout
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Verify panel pixels and cache ownership
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -Ifirmware/native/main -Ifirmware/native/tests/stubs \
            firmware/native/main/clock_overlay.cpp firmware/native/tests/scanout_frame_test.cpp \
            -o "$RUNNER_TEMP/scanout-frame-test"
          "$RUNNER_TEMP/scanout-frame-test" firmware/native/assets/clock_glyphs.bin
      - name: Compile V1 linked scanout for the OTA benchmark
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace espressif/idf:v6.1.1 \
            idf.py -C firmware/native -B firmware/native/build/linked-scanout-ci \
            -D SWIPE_BOARD=v1 -D SWIPE_LINKED_SCANOUT=ON -D SWIPE_ESPHOME_TRIAL=ON \
            -D SWIPE_TRIAL_IMMICH=ON -D SWIPE_TRIAL_BENCHMARK=ON -D SWIPE_TRIAL_BENCHMARK_RAPID=ON \
            -D SWIPE_TRIAL_REPLAY_ORIGIN=http://127.0.0.1:9116 -D SWIPE_TRIAL_REPLAY_PAIR_FILL=ON \
            -D SWIPE_TRIAL_REPLAY_STAGED_DETAIL=ON -D SWIPE_TRIAL_REPLAY_EDGE_DETAIL=ON build

  build:
    name: Test and build Guition ${{ matrix.board }} prototype
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        board: [v1, v2, v3]
    steps:
      - uses: actions/checkout@v7
      - name: Test swipe gestures and frame composition
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/native/main \
            firmware/native/tests/swipe_test.cpp -o "$RUNNER_TEMP/swipe-test"
          "$RUNNER_TEMP/swipe-test"
          c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/native/main -Ifirmware/native/tests/dma_stubs \
            -Ifirmware/native/tests/ota_stubs firmware/native/main/frame_blitter.cpp \
            firmware/native/tests/frame_blitter_test.cpp -o "$RUNNER_TEMP/frame-blitter-test"
          "$RUNNER_TEMP/frame-blitter-test"
          c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/native/main \
            firmware/native/tests/swipe_input_test.cpp -o "$RUNNER_TEMP/swipe-input-test"
          "$RUNNER_TEMP/swipe-input-test"
          c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/native/main \
            firmware/native/main/photo_controls.cpp firmware/native/tests/photo_controls_test.cpp -o "$RUNNER_TEMP/photo-controls-test"
          "$RUNNER_TEMP/photo-controls-test"
          c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/native/main \
            firmware/native/tests/autoplay_fade_test.cpp -o "$RUNNER_TEMP/autoplay-fade-test"
          "$RUNNER_TEMP/autoplay-fade-test"
          c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/native/main \
            firmware/native/tests/playback_trace_test.cpp -o "$RUNNER_TEMP/playback-trace-test"
          "$RUNNER_TEMP/playback-trace-test"
          python3 firmware/native/tests/report_performance_test.py
          python3 firmware/native/tests/report_optical_swipes_test.py
          python3 firmware/native/tests/compare_preview_replays_test.py
          c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/native/main \
            firmware/native/tests/slide_cache_test.cpp -o "$RUNNER_TEMP/slide-cache-test"
          "$RUNNER_TEMP/slide-cache-test"
          c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/native/main \
            firmware/native/tests/slide_prefetch_test.cpp -o "$RUNNER_TEMP/slide-prefetch-test"
          "$RUNNER_TEMP/slide-prefetch-test"
          c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/native/main \
            firmware/native/tests/station_retry_test.cpp -o "$RUNNER_TEMP/station-retry-test"
          "$RUNNER_TEMP/station-retry-test"
          python3 firmware/native/tools/rasterize_status.py firmware/native/assets/status_masks.bin
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main -Icomponents/espframe \
            firmware/native/main/recovery_card.cpp firmware/native/tests/wifi_recovery_test.cpp -o "$RUNNER_TEMP/wifi-recovery-test"
          "$RUNNER_TEMP/wifi-recovery-test" firmware/native/assets/recovery_glyphs.bin firmware/native/assets/status_masks.bin
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main \
            firmware/native/tests/improv_wire_test.cpp -o "$RUNNER_TEMP/improv-wire-test"
          "$RUNNER_TEMP/improv-wire-test"
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main \
            firmware/native/tests/photo_history_test.cpp -o "$RUNNER_TEMP/photo-history-test"
          "$RUNNER_TEMP/photo-history-test"
          python3 firmware/native/tools/rasterize_clock.py --check-dates firmware/native/assets/date_glyphs.bin
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main -Icomponents/espframe \
            firmware/native/main/photo_caption.cpp firmware/native/tests/photo_caption_test.cpp -o "$RUNNER_TEMP/photo-caption-test"
          "$RUNNER_TEMP/photo-caption-test" firmware/native/assets/caption_glyphs.bin firmware/native/assets/date_glyphs.bin
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main -Icomponents/espframe \
            firmware/native/main/screen_tone.cpp firmware/native/tests/screen_tone_test.cpp -o "$RUNNER_TEMP/screen-tone-test"
          "$RUNNER_TEMP/screen-tone-test"
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main -Ifirmware/native/tests/stubs \
            firmware/native/tests/recent_previews_test.cpp -o "$RUNNER_TEMP/recent-previews-test"
          "$RUNNER_TEMP/recent-previews-test"
          python3 firmware/native/tests/test_preview_decoder.py
      - name: Build native factory binary
        env:
          BOARD: ${{ matrix.board }}
          NATIVE_PREVIEW_VERSION: ${{ inputs.preview_version }}
          PREVIEW_V1_LINKED_SCANOUT: ${{ inputs.preview_v1_linked_scanout }}
        run: |
          trace=ON
          linked=OFF
          if [[ -n "$NATIVE_PREVIEW_VERSION" ]]; then
            trace=OFF
            if [[ "$BOARD" == v1 && "$PREVIEW_V1_LINKED_SCANOUT" == true ]]; then
              linked=ON
            fi
          fi
          docker pull espressif/idf:v6.1.1
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            espressif/idf:v6.1.1 idf.py -C firmware/native -B "firmware/native/build/$BOARD" \
            -D "SWIPE_BOARD=$BOARD" -D "SWIPE_TRACE=$trace" -D "SWIPE_LINKED_SCANOUT=$linked" \
            -D "NATIVE_PREVIEW_VERSION=$NATIVE_PREVIEW_VERSION" build merge-bin
      - name: Check the effective Guition network configuration
        run: |
          settings='^(CONFIG_|# CONFIG_)(SLAVE_IDF_TARGET|ESP_WIFI_REMOTE|ESP_HOSTED|EH_HOST_PORT|MDNS_PREDEF_NETIF|LWIP_MAX_SOCKETS)'
          while IFS= read -r setting; do
            if ! grep -Fxq "$setting" "firmware/native/build/${{ matrix.board }}/sdkconfig"; then
              printf 'Missing effective Wi-Fi setting: %s\n' "$setting" >&2
              exit 1
            fi
          done < <(grep -hE "$settings" firmware/native/sdkconfig.defaults firmware/native/sdkconfig.native)
      - name: Check the read-only stock settings region
        run: |
          python3 - "firmware/native/build/${{ matrix.board }}/partition_table/partition-table.bin" <<'PY'
          from pathlib import Path
          import struct
          import sys

          table = Path(sys.argv[1]).read_bytes()
          record = struct.pack("<HBBII16sI", 0x50AA, 1, 2, 0xF90000, 0x70000, b"stock_prefs", 2)
          if record not in (table[offset:offset + 32] for offset in range(0, len(table), 32)):
              raise SystemExit("Expected the stock preferences range marked read-only")
          PY
      - name: Test settings persistence
        if: matrix.board == 'v3'
        run: |
          cjson=firmware/native/managed_components/espressif__cjson/cJSON
          zones=firmware/native/build/v3/esp-idf/main
          cc -c "$cjson/cJSON.c" -o "$RUNNER_TEMP/cjson.o"
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main -Ifirmware/native/tests/stubs -Icomponents/espframe -I"$cjson" -I"$zones" \
            firmware/native/main/settings.cpp firmware/native/main/clock_settings.cpp firmware/native/main/native_configuration.cpp \
            firmware/native/main/stock_settings.cpp firmware/native/main/stock_frame_identity.cpp \
            firmware/native/tests/settings_test.cpp "$RUNNER_TEMP/cjson.o" \
            -o "$RUNNER_TEMP/settings-test"
          "$RUNNER_TEMP/settings-test"
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main -I"$cjson" \
            firmware/native/main/native_release_index.cpp firmware/native/tests/native_release_index_test.cpp \
            "$RUNNER_TEMP/cjson.o" -o "$RUNNER_TEMP/native-release-index-test"
          "$RUNNER_TEMP/native-release-index-test"
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main -Ifirmware/native/tests/stubs -I"$zones" \
            firmware/native/main/clock_settings.cpp firmware/native/main/clock_overlay.cpp \
            firmware/native/tests/clock_overlay_test.cpp -o "$RUNNER_TEMP/clock-overlay-test"
          "$RUNNER_TEMP/clock-overlay-test" firmware/native/assets/clock_glyphs.bin
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main -Icomponents/espframe -I"$zones" \
            firmware/native/main/clock_settings.cpp firmware/native/main/daylight.cpp \
            firmware/native/tests/daylight_test.cpp -o "$RUNNER_TEMP/daylight-test"
          "$RUNNER_TEMP/daylight-test"
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main -Icomponents/espframe -Itests/stubs -I"$cjson" \
            firmware/native/main/immich_selection.cpp firmware/native/tests/immich_selection_test.cpp "$RUNNER_TEMP/cjson.o" \
            -o "$RUNNER_TEMP/immich-selection-test"
          "$RUNNER_TEMP/immich-selection-test"
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main -Icomponents/espframe -Itests/stubs -I"$cjson" \
            firmware/native/main/immich_memories.cpp firmware/native/main/immich_selection.cpp \
            firmware/native/tests/immich_memories_test.cpp "$RUNNER_TEMP/cjson.o" -o "$RUNNER_TEMP/immich-memories-test"
          "$RUNNER_TEMP/immich-memories-test"
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main firmware/native/tests/web_logs_test.cpp -o "$RUNNER_TEMP/web-logs-test"
          "$RUNNER_TEMP/web-logs-test"
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main -I"$cjson" \
            firmware/native/main/c6_firmware_manifest.cpp firmware/native/tests/c6_firmware_manifest_test.cpp \
            "$RUNNER_TEMP/cjson.o" -o "$RUNNER_TEMP/c6-firmware-manifest-test"
          "$RUNNER_TEMP/c6-firmware-manifest-test"
      - name: Test firmware update staging and rollback
        if: matrix.board == 'v3'
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -pthread -DNATIVE_BOARD='"v3"' \
            -Ifirmware/native/main -Ifirmware/native/tests/ota_stubs \
            firmware/native/main/firmware_update.cpp firmware/native/tests/firmware_update_test.cpp \
            -o "$RUNNER_TEMP/firmware-update-test"
          "$RUNNER_TEMP/firmware-update-test" firmware/native/build/v3/espframe_native_v3.bin
      - name: Test Immich HTTP connection reuse
        if: matrix.board == 'v3'
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main -Ifirmware/native/tests/http_stubs \
            firmware/native/main/immich_http.cpp firmware/native/tests/immich_http_test.cpp \
            -o "$RUNNER_TEMP/immich-http-test"
          "$RUNNER_TEMP/immich-http-test"
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main -Ifirmware/native/tests/http_stubs \
            -Ifirmware/native/tests/prefetch_stubs -Ifirmware/native/tests/stubs \
            firmware/native/main/preview_prefetch.cpp firmware/native/tests/preview_prefetch_test.cpp \
            -o "$RUNNER_TEMP/native-preview-prefetch-test"
          "$RUNNER_TEMP/native-preview-prefetch-test"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-test-native-swipe-${{ matrix.board }}
          path: |
            firmware/native/build/${{ matrix.board }}/merged-binary.bin
            firmware/native/build/${{ matrix.board }}/espframe_native_${{ matrix.board }}.bin
          if-no-files-found: error

  native-ota-test:
    if: github.event_name != 'workflow_dispatch' || inputs.preview_version == ''
    name: Build native OTA recovery test images for Guition V1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Build the baseline factory image and two OTA test images
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace espressif/idf:v6.1.1 bash -ec '
            build=firmware/native/build/ota-test-v1
            artifacts=firmware/native/build/ota-test-artifacts
            mkdir -p "$artifacts"
            idf.py -C firmware/native -B "$build" -D SWIPE_BOARD=v1 -D SWIPE_NATIVE_OTA_TEST=BASELINE build merge-bin
            cp "$build/merged-binary.bin" "$artifacts/native-ota-test-v1-factory.bin"
            cp "$build/espframe_ota_test_v1.bin" "$artifacts/native-ota-test-v1-baseline.bin"
            cp "$build/partition_table/partition-table.bin" /tmp/baseline-partitions.bin
            idf.py -C firmware/native -B "$build" -D SWIPE_NATIVE_OTA_TEST=FAIL build
            cmp /tmp/baseline-partitions.bin "$build/partition_table/partition-table.bin"
            cp "$build/espframe_ota_test_v1.bin" "$artifacts/native-ota-test-v1-fail.bin"
            cd "$artifacts"
            sha256sum *.bin > SHA256SUMS
          '
      - name: Verify test identity, interrupted upload and failed startup
        run: |
          artifacts=firmware/native/build/ota-test-artifacts
          args=(-std=c++20 -Wall -Wextra -Werror -pthread '-DNATIVE_BOARD="v1"'
            -Ifirmware/native/main -Ifirmware/native/tests/ota_stubs
            firmware/native/main/firmware_update.cpp firmware/native/tests/firmware_update_test.cpp)
          c++ "${args[@]}" -o "$RUNNER_TEMP/normal-ota"
          "$RUNNER_TEMP/normal-ota" --reject "$artifacts/native-ota-test-v1-fail.bin"
          c++ "${args[@]}" -DSWIPE_NATIVE_OTA_TEST=1 -o "$RUNNER_TEMP/baseline-ota"
          "$RUNNER_TEMP/baseline-ota" "$artifacts/native-ota-test-v1-baseline.bin"
          c++ "${args[@]}" -DSWIPE_NATIVE_OTA_TEST=1 -DSWIPE_NATIVE_OTA_TEST_FAIL=1 -o "$RUNNER_TEMP/fail-ota"
          "$RUNNER_TEMP/fail-ota" "$artifacts/native-ota-test-v1-fail.bin"
          python3 firmware/native/tests/interrupt_ota_test_upload_test.py
      - uses: actions/upload-artifact@v7
        with:
          name: native-v1-ota-recovery-test
          path: firmware/native/build/ota-test-artifacts/
          if-no-files-found: error

  esphome-v1-trial:
    if: github.event_name != 'workflow_dispatch' || inputs.preview_version == ''
    name: Build the temporary V1 ESPHome swipe trial
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Test the ESPHome rollback guard
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror \
            -Ifirmware/native/main -Ifirmware/native/tests/ota_stubs \
            firmware/native/main/esphome_trial.cpp firmware/native/tests/esphome_trial_test.cpp \
            -o "$RUNNER_TEMP/esphome-trial-test"
          "$RUNNER_TEMP/esphome-trial-test"
      - name: Build an app-only image
        run: |
          docker pull espressif/idf:v6.1.1
          docker run --rm -v "$PWD:/workspace" -w /workspace espressif/idf:v6.1.1 bash -ec '
            trial=firmware/native/build/esphome-trial-v1
            idf.py -C firmware/native -B "$trial" \
              -D SWIPE_BOARD=v1 -D SWIPE_ESPHOME_TRIAL=ON -D SWIPE_TRACE=ON build
            riscv32-esp-elf-nm --defined-only "$trial/espframe_v1_legacy_swipe_trial.elf" > /tmp/trial-symbols
            if grep -E "[[:space:]](esp_ota_mark_app_valid_cancel_rollback|esp_wifi_init|eh_host_auto_init_ctor|eh_wifi_remote_glue_anchor|nvs_flash_init_partition|nvs_erase_all|nvs_set_str|httpd_start)$" /tmp/trial-symbols; then
              exit 1
            fi
          '
      - uses: actions/upload-artifact@v7
        with:
          name: native-v1-esphome-swipe-trial-app
          path: firmware/native/build/esphome-trial-v1/espframe_v1_legacy_swipe_trial.bin
          if-no-files-found: error

  browser-installer:
    name: Package the native browser installer
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-test-native-swipe-*
          path: firmware/native/build
      - name: Test and package browser setup
        env:
          NATIVE_PREVIEW_VERSION: ${{ inputs.preview_version }}
          PREVIEW_V1_LINKED_SCANOUT: ${{ inputs.preview_v1_linked_scanout }}
        run: |
          npm ci
          node firmware/native/tests/serial_setup_test.mjs
          node firmware/native/tests/backup_import_test.mjs
          node firmware/native/tests/compare_migration_backups_test.mjs
          node firmware/native/tests/wifi_recovery_browser_test.mjs
          node firmware/native/tests/shared_admin_browser_test.mjs
          node firmware/native/tests/photo_source_browser_test.mjs
          node firmware/native/tests/shared_settings_browser_test.mjs
          node firmware/native/tests/native_firmware_browser_test.mjs
          python3 scripts/tests_native_preview_releases.py
          for board in v1 v2 v3; do
            mv "firmware/native/build/firmware-test-native-swipe-$board" "firmware/native/build/$board"
          done
          node firmware/native/tests/package_installer_test.mjs firmware/native/build
          node firmware/native/tools/package_installer.mjs firmware/native/build firmware/native/build/browser-installer "$NATIVE_PREVIEW_VERSION"
          node firmware/native/tests/backup_installer_browser_test.mjs firmware/native/build/browser-installer
          node firmware/native/tests/standalone_installer_browser_test.mjs firmware/native/build/browser-installer "$NATIVE_PREVIEW_VERSION"
          if [[ -n "$NATIVE_PREVIEW_VERSION" ]]; then
            printf 'Version: %s\nSource commit: %s\nV1 linked scanout: %s\n' \
              "$NATIVE_PREVIEW_VERSION" "$(git rev-parse HEAD)" "$PREVIEW_V1_LINKED_SCANOUT" \
              > firmware/native/build/browser-installer/BUILD-INFO.txt
          fi
          cd firmware/native/build/browser-installer
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.preview_version != '' && format('espframe-native-{0}', inputs.preview_version) || 'native-browser-installer' }}
          path: firmware/native/build/browser-installer
          if-no-files-found: error

  publish-preview:
    name: Publish versioned Native Preview
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview
    needs: browser-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: espframe-native-${{ inputs.preview_version }}
          path: preview
      - name: Upload and publish verified preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.preview_version }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "native-$VERSION"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '.isDraft and .isPrerelease')" = true
          cd preview
          sha256sum -c SHA256SUMS
          zip -q "../espframe-native-$VERSION.zip" ./*
          gh release upload "$GITHUB_REF_NAME" "../espframe-native-$VERSION.zip" SHA256SUMS v[123]-ota.bin --clobber
          verify_dir=$(mktemp -d)
          gh release download "$GITHUB_REF_NAME" --pattern "espframe-native-$VERSION.zip" --pattern SHA256SUMS \
            --pattern "v[123]-ota.bin" --dir "$verify_dir"
          cmp "../espframe-native-$VERSION.zip" "$verify_dir/espframe-native-$VERSION.zip"
          cmp SHA256SUMS "$verify_dir/SHA256SUMS"
          for file in v[123]-ota.bin; do cmp "$file" "$verify_dir/$file"; done
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false

  esphome-v1-live-trial:
    if: github.event_name != 'workflow_dispatch' || inputs.preview_version == ''
    name: Build the live V1 Immich trial
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Test decoding of stock ESPHome connection preferences
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main -Icomponents/espframe \
            firmware/native/tests/live_trial_credentials_test.cpp -o "$RUNNER_TEMP/live-trial-credentials"
          "$RUNNER_TEMP/live-trial-credentials"
          c++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/native/main -Icomponents/espframe -Ifirmware/native/tests/stubs \
            firmware/native/main/stock_frame_identity.cpp firmware/native/tests/stock_frame_identity_test.cpp \
            -o "$RUNNER_TEMP/stock-frame-identity"
          "$RUNNER_TEMP/stock-frame-identity"
      - name: Test scripted gestures and timing summaries
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/native/main \
            firmware/native/tests/trial_swipe_benchmark_test.cpp -o "$RUNNER_TEMP/trial-swipe-benchmark"
          "$RUNNER_TEMP/trial-swipe-benchmark"
      - name: Build the app-only live trial
        run: |
          docker pull espressif/idf:v6.1.1
          docker run --rm -v "$PWD:/workspace" -w /workspace espressif/idf:v6.1.1 bash -ec '
            trial=firmware/native/build/esphome-live-trial-v1
            idf.py -C firmware/native -B "$trial" \
              -D SWIPE_BOARD=v1 -D SWIPE_ESPHOME_TRIAL=ON -D SWIPE_TRIAL_IMMICH=ON -D SWIPE_TRACE=ON build
            riscv32-esp-elf-nm --defined-only -C "$trial/espframe_v1_live_trial.elf" > /tmp/trial-symbols
            grep -Fq "espframe::native::start_live_trial_status(" /tmp/trial-symbols
            grep -Fq "espframe::native::read_stock_frame_name" /tmp/trial-symbols
            grep -Fq "espframe::native::record_live_trial_drag_outcome(" /tmp/trial-symbols
            grep -Fq "espframe::native::record_live_trial_detail_presented(" /tmp/trial-symbols
            if grep -E "espframe::native::(Settings::save|start_usb_setup|stage_firmware|start_home_assistant)|[[:space:]](esp_ota_mark_app_valid_cancel_rollback|nvs_erase_all|nvs_flash_erase|nvs_set_str|noise_rand_bytes)$" /tmp/trial-symbols; then
              exit 1
            fi
          '
      - uses: actions/upload-artifact@v7
        with:
          name: native-v1-esphome-live-trial-app
          path: firmware/native/build/esphome-live-trial-v1/espframe_v1_live_trial.bin
          if-no-files-found: error
      - name: Build the scripted benchmark app
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace espressif/idf:v6.1.1 bash -ec '
            live=firmware/native/build/esphome-live-trial-v1
            check_benchmark() {
              cmp "$live/partition_table/partition-table.bin" "$1/partition_table/partition-table.bin"
              riscv32-esp-elf-nm --defined-only -C "$1/$2.elf" > /tmp/bench-symbols
              grep -Fq "espframe::native::poll_live_trial_benchmark(" /tmp/bench-symbols
              if grep -E "espframe::native::(read_stock_frame_name|record_live_trial_drag_outcome)" /tmp/bench-symbols; then
                exit 1
              fi
              if grep -E "espframe::native::(Settings::save|start_usb_setup|stage_firmware|start_home_assistant)|[[:space:]](esp_ota_mark_app_valid_cancel_rollback|nvs_erase_all|nvs_flash_erase|nvs_set_str|noise_rand_bytes)$" /tmp/bench-symbols; then
                exit 1
              fi
            }
            bench=firmware/native/build/esphome-benchmark-v1
            idf.py -C firmware/native -B "$bench" -D SWIPE_BOARD=v1 \
              -D SWIPE_ESPHOME_TRIAL=ON -D SWIPE_TRIAL_IMMICH=ON -D SWIPE_TRIAL_BENCHMARK=ON build
            check_benchmark "$bench" espframe_v1_swipe_benchmark
            rapid=firmware/native/build/esphome-benchmark-rapid-v1
            idf.py -C firmware/native -B "$rapid" -D SWIPE_BOARD=v1 \
              -D SWIPE_ESPHOME_TRIAL=ON -D SWIPE_TRIAL_IMMICH=ON -D SWIPE_TRIAL_BENCHMARK=ON \
              -D SWIPE_TRIAL_BENCHMARK_RAPID=ON build
            check_benchmark "$rapid" espframe_v1_rapid_benchmark
            grep -Fq "espframe::native::record_live_trial_detail_presented(" /tmp/bench-symbols
            wifi=firmware/native/build/esphome-benchmark-wifi-v1
            idf.py -C firmware/native -B "$wifi" -D SWIPE_BOARD=v1 \
              -D SWIPE_ESPHOME_TRIAL=ON -D SWIPE_TRIAL_IMMICH=ON -D SWIPE_TRIAL_BENCHMARK=ON \
              -D SWIPE_TRIAL_WIFI_OUTAGE=ON build
            check_benchmark "$wifi" espframe_v1_wifi_benchmark
            grep -Fq "espframe::native::NativeNetwork::start_trial_wifi_outage()" /tmp/bench-symbols
            fixtures=firmware/native/build/esphome-benchmark-fixtures-v1
            idf.py -C firmware/native -B "$fixtures" -D SWIPE_BOARD=v1 -D SWIPE_ESPHOME_TRIAL=ON \
              -D SWIPE_TRIAL_IMMICH=ON -D SWIPE_TRIAL_BENCHMARK=ON -D SWIPE_TRIAL_BENCHMARK_FIXTURES=ON build
            cmp "$live/partition_table/partition-table.bin" "$fixtures/partition_table/partition-table.bin"
          '
      - uses: actions/upload-artifact@v7
        with:
          name: native-v1-esphome-swipe-benchmark
          path: |
            firmware/native/build/esphome-benchmark-v1/espframe_v1_swipe_benchmark.bin
            firmware/native/build/esphome-benchmark-rapid-v1/espframe_v1_rapid_benchmark.bin
            firmware/native/build/esphome-benchmark-fixtures-v1/espframe_v1_fixture_benchmark.bin
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: native-v1-esphome-wifi-outage-benchmark
          path: firmware/native/build/esphome-benchmark-wifi-v1/espframe_v1_wifi_benchmark.bin
          if-no-files-found: error
