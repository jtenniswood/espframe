<style>
/* __ESPFRAME_WEB_STYLE__ */
:root { color-scheme:dark; }
#sp-app { max-width:640px; }
.sp-brand-label { color:var(--text); }
.sp-device-name { font-size:.875rem; }
.sp-settings-wrap { padding:24px 16px; }
.subtitle { margin-bottom:20px; }
#h1 { overflow-wrap:anywhere; margin-bottom:14px; font-size:.875rem; font-weight:600; color:var(--text); }
#net { display:block; margin-bottom:22px; }
.network { display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--border); }
.network:last-child { border-bottom:0; }
.network-left { display:flex; align-items:center; gap:12px; min-width:0; flex:1; padding:12px 0; color:var(--text); text-decoration:none; font-size:.875rem; }
.network-left:hover { color:var(--accent-hover); }
.network-left:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
.network svg { flex-shrink:0; fill:currentColor; color:var(--text2); }
.network-ssid { overflow-wrap:anywhere; min-width:0; }
aside { display:none; padding:14px; margin-bottom:20px; border:1px solid var(--success); border-radius:10px; color:var(--text); background:var(--success-soft); font-size:.875rem; }
input[type=file] { display:block; max-width:100%; width:100%; color:var(--text2); font:inherit; font-size:.875rem; }
input[type=file]::file-selector-button { margin-right:12px; padding:10px 14px; border:1px solid var(--border); border-radius:var(--action-r); background:var(--surface2); color:var(--text); font:inherit; cursor:pointer; }
input[type=file]:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
.btn-block { min-height:44px; }
#mac { font-size:.75rem; color:var(--text2); text-align:center; overflow-wrap:anywhere; }
@media (max-width:480px) { .card { padding:20px; } .sp-settings-wrap { padding:20px 12px; } }
</style>
</head>
<body>
<div id="sp-app">
<header class="sp-header"><div class="sp-brand"><span class="sp-brand-label">Espframe</span><span class="sp-device-name">WiFi setup</span></div></header>
<main class="sp-settings-wrap">
<h1>Connect to WiFi</h1>
<p class="subtitle">Choose your network and enter its password to connect your frame.</p>
<aside role="status" aria-live="polite">Connecting to network...<br>Please wait.</aside>
<section class="card" aria-labelledby="wifi-settings-heading">
<h3 id="wifi-settings-heading">WiFi Settings</h3>
<h2 id="h1">WiFi Networks</h2>
<div id="net"></div>
<form action="/wifisave">
<div class="field"><label for="ssid">Network name (SSID)</label><input id="ssid" name="ssid" type="text" placeholder="SSID" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
<div class="field"><label for="psk">Password</label><input id="psk" name="psk" type="password" placeholder="Password" autocomplete="current-password"></div>
<button class="btn btn-primary btn-block" type="submit">Save</button>
</form>
</section>
<section class="card" aria-labelledby="ota-heading">
<h3 id="ota-heading">OTA Update</h3>
<p class="subtitle">Upload a firmware file to update your frame.</p>
<form method="POST" action="/update" enctype="multipart/form-data">
<div class="field"><label for="update">Firmware file</label><input id="update" type="file" name="update"></div>
<button class="btn btn-secondary btn-block" type="submit">Update</button>
</form>
</section>
<p id="mac">MAC Address</p>
</main>
</div>
</body>
</html>
